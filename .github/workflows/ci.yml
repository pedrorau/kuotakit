name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters live at job level (not at workflow level) so the final `ci` job always runs and can be
  # a required check: a docs-only PR would otherwise wait forever for a check that never starts.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the changed files of a PR through the API
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      ios: ${{ steps.filter.outputs.ios }}
      compose: ${{ steps.filter.outputs.compose }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build: &build
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'config/**'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            jvm:
              - *build
              - 'contracts/**'
              - 'backend/**'
              - 'architecture-tests/**'
            ios:
              - *build
              - 'contracts/**'
            compose:
              - *build
              - 'contracts/**'
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
            agent:
              - 'scripts/**'
              - '.claude/**'
              - '.gitignore' # guard_paths.py reads its secrets block
              - '.github/workflows/ci.yml'

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Compiles, runs tests (including the Konsist architecture tests), ktlint, detekt and the public API check
      # (JVM and Android targets; iOS targets need macOS, see `ios`).
      - run: ./gradlew build

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # checkKotlinAbi also proves the public API dump is the same on macOS as on the Linux `jvm` job.
      - run: ./gradlew :contracts:iosSimulatorArm64Test :contracts:compileKotlinIosArm64 :contracts:checkKotlinAbi

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:installDist
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always() && hashFiles('.env') != ''
        run: docker compose down -v

  agent-scripts:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/agent/requirements-dev.txt
      - run: python -m pytest scripts -q

  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci/check_license_headers.py

  ci:
    needs: [changes, jvm, ios, compose, agent-scripts, license-headers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi
