name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters live at job level (not at workflow level) so the final `ci` job always runs and can be
  # a required check: a docs-only PR would otherwise wait forever for a check that never starts.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the changed files of a PR through the API
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      ios: ${{ steps.filter.outputs.ios }}
      compose: ${{ steps.filter.outputs.compose }}
      conformance: ${{ steps.filter.outputs.conformance }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build: &build
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'config/**'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            jvm:
              - *build
              - 'contracts/**'
              - 'backend/**'
              - 'architecture-tests/**'
              - 'openapi/**'
              - 'conformance/**'
              - 'docs/api/**'
              - 'docs/api-spec.md' # ManifestTest reads these two
              - 'docs/conformance.md'
            ios:
              - *build
              - 'contracts/**'
            compose:
              - *build
              - 'contracts/**'
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
              - 'entitlements.example.yaml'
            conformance:
              - *build
              - 'contracts/**'
              - 'backend/**'
              - 'conformance/**'
              - 'docs/api/**'
              - 'docker-compose.conformance*.yml'
            agent:
              - 'scripts/**'
              - '.claude/**'
              - '.gitignore' # guard_paths.py reads its secrets block
              - '.github/workflows/ci.yml'

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Compiles, runs tests (including the Konsist architecture tests), ktlint, detekt and the public API check
      # (JVM and Android targets; iOS targets need macOS, see `ios`).
      - run: ./gradlew build

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # checkKotlinAbi also proves the public API dump is the same on macOS as on the Linux `jvm` job.
      - run: ./gradlew :contracts:iosSimulatorArm64Test :contracts:compileKotlinIosArm64 :contracts:checkKotlinAbi

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:installDist
      - name: Prepare the configuration (the placeholder API keys are rejected on purpose)
        run: |
          cp .env.example .env && cp entitlements.example.yaml entitlements.yaml
          sed -i "s/change_me_to_a_long_random_value/$(openssl rand -hex 24)/" .env
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Query the API like an app would
        run: |
          key=$(grep '^KUOTAKIT_APP_KEYS=' .env | cut -d= -f2)
          curl -fsS -H "Authorization: Bearer $key" localhost:8080/v1/offerings | tee /dev/stderr | grep -q '"current":"default"'
          curl -fsS -H "Authorization: Bearer $key" 'localhost:8080/v1/subscribers/$anon_ci' | tee /dev/stderr | grep -q '"entitlements":{}'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/offerings)" = 401
      - if: always() && hashFiles('.env') != ''
        run: docker compose down -v

  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.conformance.yml -f docker-compose.conformance.reference.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:installDist :conformance:installDist
      - name: The suite against the reference backend (the shipped image, with the fake Google)
        run: $COMPOSE up --build --abort-on-container-exit --exit-code-from conformance
      - name: The suite checks itself (a corrupted backend must turn it red)
        run: CONFORMANCE_COMMAND=self-check $COMPOSE up --abort-on-container-exit --exit-code-from conformance
      - name: Level 1 only, for a backend that cannot redirect its Google calls
        run: >
          CONFORMANCE_LEVEL=1 CONFORMANCE_CUSTOM_GOOGLE= CONFORMANCE_GOOGLE_API_URL= CONFORMANCE_GOOGLE_CERTS_URL=
          $COMPOSE up --abort-on-container-exit --exit-code-from conformance
      - name: Another backend can be plugged in, and an incomplete one fails naming the scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/stub/www" && printf '{"status":"ok"}' > "$RUNNER_TEMP/stub/www/health"
          printf 'FROM busybox\nCOPY www /www\nCMD ["httpd","-f","-p","8080","-h","/www"]\n' > "$RUNNER_TEMP/stub/Dockerfile"
          docker build -t stub-backend:ci "$RUNNER_TEMP/stub"
          if CONFORMANCE_BACKEND_IMAGE=stub-backend:ci CONFORMANCE_LEVEL=1 \
            docker compose -f docker-compose.conformance.yml up --abort-on-container-exit --exit-code-from conformance \
            > "$RUNNER_TEMP/stub.log" 2>&1; then
            echo "an incomplete backend passed the suite"; exit 1
          fi
          grep -q 'Result: NOT conformant: failed' "$RUNNER_TEMP/stub.log"
          grep -q 'FAIL  L1-02' "$RUNNER_TEMP/stub.log"
      - if: always()
        run: $COMPOSE down -v

  agent-scripts:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/agent/requirements-dev.txt
      - run: python -m pytest scripts -q

  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci/check_license_headers.py

  ci:
    needs: [changes, jvm, ios, compose, conformance, agent-scripts, license-headers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi
