# Local / self-hosted setup: backend + Postgres. Works with any Docker engine (Docker Desktop, Colima, OrbStack, Linux).
# Before the first run: ./gradlew :backend:installDist && cp .env.example .env
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuotakit}
      POSTGRES_USER: ${POSTGRES_USER:-kuotakit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Prepared for the storage layer (ADR 0009); the backend does not use the database yet.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kuotakit}
      DATABASE_USER: ${POSTGRES_USER:-kuotakit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}

volumes:
  postgres-data:
