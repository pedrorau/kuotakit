# Local / self-hosted setup: backend + Postgres. Works with any Docker engine (Docker Desktop, Colima, OrbStack, Linux).
# Before the first run: ./gradlew :backend:installDist && cp .env.example .env && cp entitlements.example.yaml entitlements.yaml
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuotakit}
      POSTGRES_USER: ${POSTGRES_USER:-kuotakit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Long syntax on purpose: with the short one Docker creates a *directory* named entitlements.yaml when the file
      # is missing, and the backend then fails with a confusing message. This way compose stops and says what is missing.
      - type: bind
        source: ./entitlements.yaml
        target: /config/entitlements.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kuotakit}
      DATABASE_USER: ${POSTGRES_USER:-kuotakit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      KUOTAKIT_APP_KEYS: ${KUOTAKIT_APP_KEYS:?Set KUOTAKIT_APP_KEYS in .env}
      KUOTAKIT_SECRET_KEYS: ${KUOTAKIT_SECRET_KEYS:-}
      KUOTAKIT_ENTITLEMENTS_FILE: /config/entitlements.yaml
      # Limits per minute and the reverse proxy setting (docs/adr/0016). Empty means the default.
      KUOTAKIT_RATE_LIMIT_PER_MINUTE: ${KUOTAKIT_RATE_LIMIT_PER_MINUTE:-}
      KUOTAKIT_RATE_LIMIT_RECEIPTS_PER_MINUTE: ${KUOTAKIT_RATE_LIMIT_RECEIPTS_PER_MINUTE:-}
      KUOTAKIT_RATE_LIMIT_RECEIPTS_PER_USER_PER_MINUTE: ${KUOTAKIT_RATE_LIMIT_RECEIPTS_PER_USER_PER_MINUTE:-}
      KUOTAKIT_TRUST_FORWARDED_FOR: ${KUOTAKIT_TRUST_FORWARDED_FOR:-}

volumes:
  postgres-data:
