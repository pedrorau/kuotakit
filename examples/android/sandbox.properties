# The defaults the example app starts with. Anyone who clones can change them here, in the file `local.properties` of
# the repository root (`sandbox.baseUrl=...`, `sandbox.apiKey=...`, never committed), or in the Settings screen of the
# app, with no new build.
#
# Only public values belong here: the address of a backend and its PUBLIC key (`pk_...`), which is meant to be inside an
# app. A secret key (`sk_...`) never goes in an app, and the SDK refuses it.
#
# Empty until the public sandbox backend exists (docs/sandbox-play-console.md, part H, stage 2): the app then opens its
# Settings screen and says so.
baseUrl=
apiKey=
